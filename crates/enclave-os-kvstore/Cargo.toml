[package]
name = "enclave-os-kvstore"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Sealed KV store module for enclave-os — AES-256-GCM encrypted storage inside SGX."

[lib]
name = "enclave_os_kvstore"

[dependencies]
# Shared types, module trait, OCall vtable, and AEAD cipher
enclave-os-common = { path = "../../common", features = ["crypto"] }

# Crypto (HMAC for deterministic key name obfuscation)
ring = "0.17"

# Standalone workspace: this crate is a path dependency of `enclave/`, which is
# itself excluded from the root workspace. Without this, targeting the crate with
# --manifest-path fails with "current package believes it's in a workspace when it
# is not", so its unit tests could not be run at all. The SGX-only crates
# (merkle, raft, vault, wasm) already carry this.
[workspace]
